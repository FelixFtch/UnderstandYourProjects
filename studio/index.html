<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jarvis Studio: the console for your household Jarvis." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Jarvis Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c1a15'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='20' fill='%23f4f0e8'%3EJ%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint (see src/app/theme.ts).
      (function () {
        try {
          var p = localStorage.getItem("jarvis.studio.theme") || "light";
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
